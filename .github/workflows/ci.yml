name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installe cfn-lint
        run: pip install cfn-lint
      - name: Valide le pattern ALB + ASG
        run: cfn-lint cloudformation/template-basic-alb-asg.yaml
      - name: Valide le pattern de routage par chemin
        run: cfn-lint cloudformation/template-path-based-routing.yaml
