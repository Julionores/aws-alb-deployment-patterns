AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Pattern 2 : routage par chemin (path-based routing) sur un ALB, avec deux instances
  "Blue" et "Green" derrière deux Target Groups distincts. /blue* est routé vers l'instance
  Blue, /green* vers l'instance Green -- un pattern utile pour des déploiements progressifs
  ou pour exposer plusieurs versions/environnements derrière un seul point d'entrée.
  Le template de cours d'origine créait les deux instances (avec leur configuration nginx
  /blue et /green) mais jamais l'ALB, les Target Groups ni les règles de routage.

Parameters:
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: AMI Amazon Linux 2023 la plus récente (résolue via SSM Parameter Store)

Resources:
  MyVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.6.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: LabVPCPathRouting

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref MyVPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: 10.6.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: PublicSubnet1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: 10.6.2.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: PublicSubnet2

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref MyVPC

  Route:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref RouteTable

  SubnetRouteTableAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref RouteTable

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Autorise le trafic HTTP entrant depuis Internet
      VpcId: !Ref MyVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Autorise le trafic HTTP uniquement depuis le load balancer
      VpcId: !Ref MyVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref AlbSecurityGroup

  BlueInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: t2.micro
      SubnetId: !Ref PublicSubnet1
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      UserData:
        Fn::Base64: |
          #!/bin/bash
          yum update -y
          yum install -y nginx
          mkdir -p /usr/share/nginx/html/blue
          echo "<h1 style='color:blue'>I AM BLUE</h1>" > /usr/share/nginx/html/blue/index.html
          cat <<'EOF' > /etc/nginx/conf.d/blue.conf
          server {
              listen 80;
              server_name _;
              location /blue {
                  root /usr/share/nginx/html;
                  index index.html;
              }
          }
          EOF
          systemctl enable nginx
          systemctl restart nginx
      Tags:
        - Key: Name
          Value: BlueInstance

  GreenInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: t2.micro
      SubnetId: !Ref PublicSubnet2
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      UserData:
        Fn::Base64: |
          #!/bin/bash
          yum update -y
          yum install -y nginx
          mkdir -p /usr/share/nginx/html/green
          echo "<h1 style='color:green'>I AM GREEN</h1>" > /usr/share/nginx/html/green/index.html
          cat <<'EOF' > /etc/nginx/conf.d/green.conf
          server {
              listen 80;
              server_name _;
              location /green {
                  root /usr/share/nginx/html;
                  index index.html;
              }
          }
          EOF
          systemctl enable nginx
          systemctl restart nginx
      Tags:
        - Key: Name
          Value: GreenInstance

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Tags:
        - Key: Name
          Value: LabALBPathRouting

  BlueTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref MyVPC
      Port: 80
      Protocol: HTTP
      TargetType: instance
      HealthCheckEnabled: true
      HealthCheckPath: /blue/
      Matcher:
        HttpCode: '200'
      Targets:
        - Id: !Ref BlueInstance

  GreenTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref MyVPC
      Port: 80
      Protocol: HTTP
      TargetType: instance
      HealthCheckEnabled: true
      HealthCheckPath: /green/
      Matcher:
        HttpCode: '200'
      Targets:
        - Id: !Ref GreenInstance

  # Action par défaut : nécessaire pour tout Listener, même si l'on ne s'attend qu'à des
  # requêtes /blue* ou /green* -- ici on route par défaut vers Blue.
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref BlueTargetGroup

  GreenPathRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 1
      Conditions:
        - Field: path-pattern
          Values:
            - '/green*'
      Actions:
        - Type: forward
          TargetGroupArn: !Ref GreenTargetGroup

  BluePathRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 2
      Conditions:
        - Field: path-pattern
          Values:
            - '/blue*'
      Actions:
        - Type: forward
          TargetGroupArn: !Ref BlueTargetGroup

Outputs:
  LoadBalancerDNSName:
    Description: DNS name du load balancer
    Value: !GetAtt ApplicationLoadBalancer.DNSName
  BlueUrl:
    Description: URL de la version Blue
    Value: !Sub http://${ApplicationLoadBalancer.DNSName}/blue/
  GreenUrl:
    Description: URL de la version Green
    Value: !Sub http://${ApplicationLoadBalancer.DNSName}/green/
